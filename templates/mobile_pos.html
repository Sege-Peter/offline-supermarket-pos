<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile POS & Camera Scanner - Lane 01</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
</head>
<body style="height: auto; min-height: 100vh; overflow-y: auto; padding-bottom: 80px;">

  <!-- Top Application Bar -->
  <header class="top-bar">
    <div class="brand-section">
      <div class="brand-logo-badge">⚡</div>
      <div class="brand-title">
        METRO<span class="highlight-cyan">POS</span> <span class="highlight-orange" style="font-size: 0.8rem; font-weight: 800;">MOBILE</span>
      </div>
    </div>

    <div class="top-bar-controls">
      <div class="currency-picker-wrap" title="Change Active Store Currency">
        <span>🌐</span>
        <select id="currencyPicker"></select>
      </div>

      <div class="user-auth-pill" onclick="openAuthModal()">
        <span id="currentUserRole" class="user-role-tag cashier">CASHIER</span>
        <span id="currentUserName">Jane Doe</span>
        <span>🔒</span>
      </div>
    </div>

    <nav style="display: flex; gap: 8px; flex-wrap: wrap;">
      <a href="/" class="tab-btn" style="padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm);">💻 Terminal</a>
      <a href="/mobile" class="tab-btn active" style="padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm);">📷 Mobile</a>
      <a href="/dashboard" class="tab-btn" style="padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm);">📊 Dashboard</a>
      <a href="/inventory" class="tab-btn" style="padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm);">📦 Inventory</a>
      <a href="/reports" class="tab-btn" style="padding: 6px 12px; font-size: 0.85rem; border-radius: var(--radius-sm);">📜 Reports</a>
    </nav>
  </header>

  <main style="max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <!-- Camera Scanner Section -->
    <div class="settings-section-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.15rem; color: var(--cyan-bright);">📷 Barcode Camera Scanner</h2>
        <button class="tool-btn btn-cyan" id="btnCameraToggle" onclick="toggleMobileCamera()">Start Camera</button>
      </div>
      <div id="mobileReader" style="width: 100%; border-radius: var(--radius-md); overflow: hidden; display: none; border: 2px solid var(--cyan-primary);"></div>
      <div id="cameraStatus" style="padding: 10px; background: var(--bg-card); border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-mono); color: var(--text-secondary); text-align: center;">
        Ready to scan 1D UPC/EAN barcodes or 2D QR codes.
      </div>
    </div>

    <!-- Manual Barcode Search -->
    <div class="scanner-strip" style="background: var(--bg-panel); border-radius: var(--radius-md); border: 1px solid var(--border);">
      <input type="text" id="barcodeInput" class="input-barcode" placeholder="Manual Barcode + Enter...">
      <button class="tool-btn btn-cyan" onclick="triggerMobileBarcode()">Enter</button>
    </div>

    <!-- Mobile Cart List -->
    <div class="settings-section-card" style="padding: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 1rem; color: var(--text-primary);">🛒 Current Basket (<span id="cartItemCount">0</span>)</h3>
        <button class="btn-void" style="padding: 4px 10px; font-size: 0.8rem;" onclick="voidCart()">Clear</button>
      </div>

      <table class="cart-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartItemsBody"></tbody>
      </table>

      <div style="border-top: 2px solid var(--border); margin-top: 14px; padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary);">TOTAL:</span>
        <span id="cartGrandTotal" style="font-size: 1.8rem; font-weight: 900; font-family: var(--font-mono); color: var(--cyan-bright);">$0.00</span>
      </div>
    </div>
  </main>

  <!-- Sticky Bottom Checkout Bar -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel); border-top: 2px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: center; z-index: 1000;">
    <button class="btn-checkout-primary" style="flex: 1; padding: 14px;" onclick="handleCheckout()">
      <span>⚡ Complete Sale</span>
    </button>
  </div>

  <!-- EPOS Thermal Receipt Modal (80mm / 58mm) -->
  <div id="receiptModal" class="modal-backdrop">
    <div class="receipt-modal-container">
      <div class="receipt-modal-header">
        <h3>🧾 EPOS Thermal Receipt</h3>
        <div class="paper-width-switch">
          <button class="paper-width-btn" data-width="80mm" onclick="setReceiptPaperWidth('80mm')">80mm</button>
          <button class="paper-width-btn active" data-width="58mm" onclick="setReceiptPaperWidth('58mm')">58mm</button>
        </div>
      </div>
      <div class="receipt-scroll-wrap">
        <div id="eposThermalPaper" class="epos-thermal-paper width-58mm"></div>
      </div>
      <div class="receipt-modal-actions">
        <button class="btn-print-action" onclick="printThermalReceipt()">
          <span>🖨️ Print Receipt</span>
        </button>
        <button class="btn-modal-close" onclick="closeReceiptModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- Admin PIN Auth Modal -->
  <div id="authModal" class="modal-backdrop">
    <div class="auth-modal-card">
      <div class="auth-lock-icon">🔒</div>
      <h3 class="auth-title">Authorization Required</h3>
      <p class="auth-subtitle" id="authModalSubtitle">Enter PIN to authenticate:</p>
      <div class="pin-display-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="keypad-grid">
        <button class="keypad-btn" onclick="pressPinKey('1')">1</button>
        <button class="keypad-btn" onclick="pressPinKey('2')">2</button>
        <button class="keypad-btn" onclick="pressPinKey('3')">3</button>
        <button class="keypad-btn" onclick="pressPinKey('4')">4</button>
        <button class="keypad-btn" onclick="pressPinKey('5')">5</button>
        <button class="keypad-btn" onclick="pressPinKey('6')">6</button>
        <button class="keypad-btn" onclick="pressPinKey('7')">7</button>
        <button class="keypad-btn" onclick="pressPinKey('8')">8</button>
        <button class="keypad-btn" onclick="pressPinKey('9')">9</button>
        <button class="keypad-btn action-btn action-clear" onclick="clearPin()">C</button>
        <button class="keypad-btn" onclick="pressPinKey('0')">0</button>
        <button class="keypad-btn action-btn action-enter" onclick="submitPin()">OK</button>
      </div>
      <button class="tool-btn" style="width: 100%; justify-content: center; font-size: 0.8rem; margin-top: 8px;" onclick="closeAuthModal()">Cancel</button>
    </div>
  </div>

  <script src="/static/js/pos-engine.js"></script>
  <script>
    let html5QrCode = null;
    let isCameraRunning = false;

    function toggleMobileCamera() {
      const reader = document.getElementById('mobileReader');
      const btn = document.getElementById('btnCameraToggle');
      const fb = document.getElementById('cameraStatus');

      if (!html5QrCode) html5QrCode = new Html5Qrcode("mobileReader");

      if (isCameraRunning) {
        html5QrCode.stop().then(() => {
          reader.style.display = 'none';
          btn.innerText = 'Start Camera';
          btn.className = 'tool-btn btn-cyan';
          fb.innerText = 'Camera stopped.';
          isCameraRunning = false;
        });
      } else {
        reader.style.display = 'block';
        fb.innerText = 'Initializing camera...';
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 280, height: 160 } },
          (decodedText) => {
            playBeep(1760, 0.1);
            fb.innerText = `Scanned: ${decodedText}`;
            lookupBarcode(decodedText);
          },
          () => {}
        ).then(() => {
          btn.innerText = 'Stop Camera';
          btn.className = 'tool-btn btn-orange';
          fb.innerText = 'Scanning... Align barcode in the reticle.';
          isCameraRunning = true;
        }).catch(err => {
          fb.innerText = 'Camera error: ' + err;
        });
      }
    }

    const bInput = document.getElementById('barcodeInput');
    if (bInput) {
      bInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          triggerMobileBarcode();
        }
      });
    }

    function triggerMobileBarcode() {
      if (bInput && bInput.value) {
        lookupBarcode(bInput.value);
        bInput.value = '';
      }
    }
  </script>
</body>
</html>
